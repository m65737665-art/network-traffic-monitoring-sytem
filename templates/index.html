<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NetWatch</title>
</head>

<body style="background:#05080f;color:white;font-family:Arial;padding:30px">

<h2 style="border-left:4px solid #3b82f6;padding-left:10px">
NetWatch <span style="color:#3b82f6">- Network analyzer</span>
</h2>

<!-- STATS -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px">

<div style="background:#111827;padding:20px;border-radius:10px">
Total Packets
<h2 id="s-total">0</h2>
</div>

<div style="background:#111827;padding:20px;border-radius:10px">
TCP
<h2 id="s-tcp" style="color:#3b82f6">0</h2>
</div>

<div style="background:#111827;padding:20px;border-radius:10px">
UDP
<h2 id="s-udp" style="color:#f59e0b">0</h2>
</div>

<div style="background:#111827;padding:20px;border-radius:10px">
ICMP
<h2 id="s-icmp" style="color:#a855f7">0</h2>
</div>

</div>


<!-- UPLOAD -->
<div onclick="document.getElementById('file').click()"
style="margin-top:30px;border:2px dashed #3b82f6;padding:40px;text-align:center;border-radius:10px;cursor:pointer">

<b style="color:#3b82f6">Upload CSV Capture</b>
<br>
<span style="color:gray">Click here to load packet data</span>

<input type="file" id="file" hidden>

</div>

<!-- FILTER BAR -->
<div style="margin-top:25px;background:#111827;padding:15px;border-radius:10px;display:flex;gap:10px">

<select id="proto"
style="padding:8px;background:#1f2937;color:white;border:1px solid #374151;border-radius:6px">
<option value="ALL">All Protocols</option>
<option value="TCP">TCP</option>
<option value="UDP">UDP</option>
<option value="ICMP">ICMP</option>
</select>

<input id="search" placeholder="Search IP or service"
style="flex:1;padding:8px;background:#1f2937;color:white;border:1px solid #374151;border-radius:6px">

<button onclick="fetchData()"
style="background:#2563eb;color:white;padding:8px 15px;border:none;border-radius:6px">
Update
</button>

<button onclick="clearData()"
style="background:#dc2626;color:white;padding:8px 15px;border:none;border-radius:6px">
Clear
</button>

</div>

<!-- TABLE -->
<div style="margin-top:20px;background:#111827;border-radius:10px">

<table style="width:100%;border-collapse:collapse">

<thead style="background:#1f2937">
<tr>
<th style="padding:10px">Time</th>
<th>Source IP</th>
<th>Src Port</th>
<th>Destination IP</th>
<th>Dst Port</th>
<th>Protocol</th>
<th>Service</th>
<th>Size</th>
</tr>
</thead>

<tbody id="table">
<tr>
<td colspan="8" style="text-align:center;padding:40px;color:gray">
Upload a CSV file
</td>
</tr>
</tbody>

</table>
</div>


<script>

document.getElementById("file").addEventListener("change", async () => {

let f = document.getElementById("file").files[0];
if(!f) return;

let form = new FormData();
form.append("file",f);

let r = await fetch("/upload",{method:"POST",body:form});
let d = await r.json();

if(d.status=="success"){
alert("Loaded "+d.count+" packets");
fetchData();
}

});


async function fetchData(){

let proto = document.getElementById("proto").value;
let search = document.getElementById("search").value;

let r = await fetch(`/packets?protocol=${proto}&search=${search}`);
let d = await r.json();

document.getElementById("s-total").innerText=d.stats.total;
document.getElementById("s-tcp").innerText=d.stats.tcp;
document.getElementById("s-udp").innerText=d.stats.udp;
document.getElementById("s-icmp").innerText=d.stats.icmp;

let table=document.getElementById("table");

if(d.packets.length==0){
table.innerHTML="<tr><td colspan=8 style='text-align:center;padding:40px'>No Data</td></tr>";
return;
}

table.innerHTML=d.packets.slice(0,200).map(p=>`
<tr>
<td style="padding:8px;color:gray">${p.time}</td>
<td>${p.src_ip}</td>
<td style="color:#3b82f6">${p.src_port}</td>
<td>${p.dst_ip}</td>
<td style="color:#3b82f6">${p.dst_port}</td>
<td>${p.protocol}</td>
<td style="color:#10b981">${p.service}</td>
<td>${p.size}</td>
</tr>
`).join("");

}


async function clearData(){
if(confirm("Clear all data?")){
await fetch("/clear",{method:"POST"});
location.reload();
}
}

</script>

</body>
</html>
